<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ghost Data Audit — Pipeline Visualizer</title>
<style>
  :root{
    --bg:#0a0b0f; --grid:#1a1d24; --card:#14161e; --card-border:#262b38;
    --card-border-hi:#394154;
    --text:#eef0f6; --muted:#8b93a3; --accent:#6c8cff; --accent2:#7c5cff;
    --teal:#2dd4bf; --violet:#a78bfa; --green:#4ade80; --slate:#94a3b8;
    --amber:#fbbf24; --red:#f87171; --blue:#60a5fa;
    --dur-base:1; /* multiplier, set to a big number under reduced motion */
  }
  @media (prefers-reduced-motion: reduce){ :root{ --dur-base:1000; } }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    font-size:14px; overflow:hidden; position:relative;
  }
  /* ---------- ambient background ---------- */
  .bg-blob{
    position:fixed; border-radius:50%; filter:blur(90px); opacity:.22; pointer-events:none; z-index:0;
    animation:drift calc(26s * var(--dur-base)) ease-in-out infinite;
  }
  .bg-blob.b1{width:520px; height:520px; background:#5b6cff; top:-120px; left:-80px;}
  .bg-blob.b2{width:460px; height:460px; background:#a855f7; bottom:-160px; right:-60px; animation-duration:calc(32s * var(--dur-base)); animation-delay:-6s;}
  .bg-blob.b3{width:380px; height:380px; background:#2dd4bf; top:40%; left:45%; animation-duration:calc(40s * var(--dur-base)); animation-delay:-14s;}
  @keyframes drift{
    0%,100%{ transform:translate(0,0) scale(1); }
    33%{ transform:translate(60px,-40px) scale(1.08); }
    66%{ transform:translate(-50px,30px) scale(.94); }
  }
  .bg-grid{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image:radial-gradient(circle,var(--grid) 1px,transparent 1px);
    background-size:24px 24px; opacity:.6;
    mask-image:radial-gradient(circle at 50% 40%, black 10%, transparent 85%);
  }
  .vignette{position:fixed; inset:0; z-index:0; pointer-events:none;
    box-shadow:inset 0 0 220px 60px rgba(0,0,0,.65);}

  /* ---------- header ---------- */
  header{
    position:relative; z-index:3; display:flex; flex-wrap:wrap; gap:10px; padding:14px 20px;
    align-items:center; backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    background:linear-gradient(180deg, rgba(16,18,26,.78), rgba(16,18,26,.5));
    border-bottom:1px solid var(--card-border);
  }
  .brand{display:flex; align-items:center; gap:10px; margin-right:8px;}
  .brand .dot{width:9px; height:9px; border-radius:50%; background:var(--green);
    box-shadow:0 0 10px var(--green); animation:pulseDot calc(1.6s * var(--dur-base)) ease-in-out infinite;}
  @keyframes pulseDot{0%,100%{opacity:1; transform:scale(1);} 50%{opacity:.4; transform:scale(.7);}}
  header h1{font-size:15px; margin:0; font-weight:700; letter-spacing:.01em;
    background:linear-gradient(90deg,#fff,#aeb8ff 60%,#7c5cff); -webkit-background-clip:text;
    background-clip:text; color:transparent;}
  header .sub{font-size:11px; color:var(--muted); margin-top:1px;}

  .metric{
    position:relative; background:linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.01));
    border:1px solid var(--card-border); border-radius:12px;
    padding:8px 14px; min-width:96px; overflow:hidden; transition:border-color .2s, transform .2s;
  }
  .metric:hover{border-color:var(--card-border-hi); transform:translateY(-1px);}
  .metric .v{font-size:19px; font-weight:800; line-height:1.1;}
  .metric .l{font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin-top:2px;}
  .metric.glow-ok .v{color:var(--green);}
  .metric.glow-llm .v{color:var(--violet);}
  .metric-bar{display:flex; height:5px; border-radius:4px; overflow:hidden; margin-top:6px; width:140px;}
  .metric-bar span{height:100%; transition:width calc(1s * var(--dur-base)) cubic-bezier(.2,.8,.2,1);}

  .toolbar{margin-left:auto; display:flex; align-items:center; gap:10px;}
  #case-search{
    background:var(--card); border:1px solid var(--card-border);
    color:var(--text); border-radius:9px; padding:8px 12px; min-width:220px; font-size:13px;
    transition:border-color .2s, box-shadow .2s;
  }
  #case-search:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(108,140,255,.18);}
  #run-btn{
    background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; border:none;
    border-radius:9px; padding:9px 16px; font-size:13px; font-weight:700; cursor:pointer;
    box-shadow:0 4px 18px rgba(124,92,255,.35); transition:transform .15s, box-shadow .15s;
  }
  #run-btn:hover{transform:translateY(-1px); box-shadow:0 6px 22px rgba(124,92,255,.5);}
  #run-btn:active{transform:translateY(0) scale(.97);}

  /* ---------- main layout ---------- */
  main{position:relative; z-index:1; display:flex; height:calc(100vh - 66px);}
  #viewport{flex:1; position:relative; overflow:hidden; cursor:grab;}
  #viewport.dragging{cursor:grabbing;}
  #canvas{position:absolute; top:0; left:0; transform-origin:0 0; will-change:transform;}
  svg#flow{display:block; overflow:visible;}

  .zoom-ctl{position:absolute; right:16px; bottom:16px; z-index:2; display:flex; flex-direction:column;
    gap:6px; background:rgba(20,22,30,.8); border:1px solid var(--card-border); border-radius:10px; padding:6px;
    backdrop-filter:blur(8px);}
  .zoom-ctl button{width:30px; height:30px; border-radius:7px; border:1px solid var(--card-border);
    background:var(--card); color:var(--text); cursor:pointer; font-size:15px; line-height:1;}
  .zoom-ctl button:hover{border-color:var(--accent); color:var(--accent);}
  .hint{position:absolute; left:16px; bottom:16px; z-index:2; font-size:11px; color:var(--muted);
    background:rgba(20,22,30,.7); padding:6px 10px; border-radius:8px; border:1px solid var(--card-border);}

  .node-card{
    position:absolute; width:220px; border-radius:14px; border:1px solid var(--card-border);
    background:linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,.01)), var(--card);
    padding:12px 13px; cursor:pointer; user-select:none;
    transition:border-color .18s, transform .18s, box-shadow .18s;
    opacity:0; transform:translateY(14px) scale(.97);
    animation:nodeIn calc(.5s * var(--dur-base)) cubic-bezier(.2,.8,.2,1) forwards;
  }
  @keyframes nodeIn{to{opacity:1; transform:translateY(0) scale(1);}}
  .node-card::before{content:""; position:absolute; left:0; top:12px; bottom:12px; width:3px; border-radius:3px;
    background:var(--kind-color,var(--accent));}
  .node-card:hover{border-color:var(--card-border-hi); transform:translateY(-3px);
    box-shadow:0 10px 28px rgba(0,0,0,.45), 0 0 0 1px var(--card-border-hi);}
  .node-card.selected{border-color:var(--kind-color,var(--accent));
    box-shadow:0 0 0 1px var(--kind-color,var(--accent)), 0 0 26px -4px var(--kind-color,var(--accent));}
  .node-card.pulse{animation:nodePulse calc(.9s * var(--dur-base)) ease-out;}
  @keyframes nodePulse{
    0%{box-shadow:0 0 0 0 var(--kind-color,var(--accent));}
    60%{box-shadow:0 0 0 14px transparent;}
    100%{box-shadow:0 0 0 0 transparent;}
  }
  .badge{
    display:inline-flex; align-items:center; gap:4px; font-size:10px; padding:2px 8px 2px 6px; border-radius:999px;
    margin-bottom:7px; text-transform:uppercase; letter-spacing:.03em; font-weight:800;
  }
  .badge.Deterministic{background:rgba(45,212,191,.14); color:var(--teal);}
  .badge.LLM{background:rgba(167,139,250,.16); color:var(--violet);}
  .badge.Validation{background:rgba(74,222,128,.14); color:var(--green);}
  .badge.Data{background:rgba(148,163,184,.14); color:var(--slate);}
  .node-title{font-weight:700; font-size:13.5px; margin-bottom:4px; display:flex; align-items:center; gap:6px;}
  .node-file{font-family:ui-monospace,Consolas,monospace; font-size:10.5px; color:var(--muted); word-break:break-all;}
  .node-counts{font-size:11px; color:var(--muted); margin-top:7px; display:flex; justify-content:space-between;}

  path.edge{fill:none; stroke:#3a4150; stroke-width:1.6; stroke-dasharray:6 6; opacity:.8;}
  path.edge.anim{animation:dash calc(1.1s * var(--dur-base)) linear infinite;}
  @keyframes dash{to{stroke-dashoffset:-12;}}
  path.edge-glow{fill:none; stroke-width:7; opacity:0; filter:blur(3px);}
  path.edge-glow.lit{opacity:.35; transition:opacity .25s;}
  .particle{filter:drop-shadow(0 0 4px currentColor);}
  text.edge-label{fill:var(--muted); font-size:10px; font-family:ui-monospace,Consolas,monospace;}

  /* ---------- panel ---------- */
  #panel{
    width:360px; border-left:1px solid var(--card-border); padding:0; overflow-y:auto;
    flex-shrink:0; background:linear-gradient(180deg, rgba(16,18,26,.7), rgba(12,13,18,.9));
    backdrop-filter:blur(10px);
  }
  #panel-inner{padding:18px; animation:panelIn calc(.3s * var(--dur-base)) ease forwards; opacity:0; transform:translateX(8px);}
  @keyframes panelIn{to{opacity:1; transform:translateX(0);}}
  #panel h2{font-size:16px; margin:0 0 2px; display:flex; align-items:center; gap:8px;}
  #panel .section{margin-bottom:18px;}
  #panel .section h3{font-size:10.5px; text-transform:uppercase; color:var(--muted); letter-spacing:.06em; margin:0 0 8px;}
  .status-pill{display:inline-flex; align-items:center; gap:6px; font-weight:800; font-size:13px;
    padding:4px 11px; border-radius:999px;}
  .status-pill.COMPLETE{background:rgba(74,222,128,.15); color:var(--green);}
  .status-pill.INCOMPLETE{background:rgba(251,191,36,.15); color:var(--amber);}
  .status-pill.NOT_APPLICABLE{background:rgba(148,163,184,.15); color:var(--slate);}
  .status-pill .sdot{width:7px; height:7px; border-radius:50%; background:currentColor; box-shadow:0 0 6px currentColor;}

  .chip{display:inline-block; padding:2px 9px; border-radius:999px; font-size:10.5px; font-weight:800; margin-right:4px;}
  .chip.FINDING{background:rgba(248,113,113,.16); color:var(--red);}
  .chip.REMEDIATION{background:rgba(251,191,36,.16); color:var(--amber);}
  .chip.VERIFICATION{background:rgba(74,222,128,.16); color:var(--green);}

  .timeline{position:relative; padding-left:16px;}
  .timeline::before{content:""; position:absolute; left:4px; top:4px; bottom:4px; width:2px;
    background:linear-gradient(180deg, var(--red), var(--amber), var(--green));}
  .step-row{position:relative; border:1px solid var(--card-border); border-radius:10px; padding:9px 10px;
    margin-bottom:8px; font-size:12px; background:rgba(255,255,255,.02);}
  .step-row::before{content:""; position:absolute; left:-16px; top:14px; width:8px; height:8px; border-radius:50%;
    background:var(--dot-color,var(--muted)); box-shadow:0 0 6px var(--dot-color,var(--muted));}
  .step-row .mono{font-family:ui-monospace,Consolas,monospace; color:var(--muted); font-size:11px; margin-top:3px;}

  .state-tag{font-size:10px; font-weight:800; padding:1px 7px; border-radius:6px;}
  .state-tag.ABSENT{background:rgba(74,222,128,.15); color:var(--green);}
  .state-tag.PRESENT{background:rgba(248,113,113,.15); color:var(--red);}
  .state-tag.REDACTED, .state-tag.ANONYMIZED{background:rgba(96,165,250,.15); color:var(--blue);}
  .state-tag.default{background:rgba(148,163,184,.15); color:var(--slate);}

  .resource-row{display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:12px;
    padding:7px 0; border-bottom:1px solid var(--card-border);}
  .resource-row:last-child{border-bottom:none;}
  .muted{color:var(--muted); font-size:12px;}

  ::-webkit-scrollbar{width:9px; height:9px;}
  ::-webkit-scrollbar-thumb{background:#2a2f3c; border-radius:6px;}
  ::-webkit-scrollbar-thumb:hover{background:#3a4150;}

  @media (max-width: 1024px){
    #panel{width:300px;}
    .metric{min-width:80px; padding:7px 10px;}
    header h1{font-size:13px;}
  }
</style>
</head>
<body>
<div class="bg-blob b1"></div>
<div class="bg-blob b2"></div>
<div class="bg-blob b3"></div>
<div class="bg-grid"></div>
<div class="vignette"></div>

<header>
  <div class="brand"><span class="dot"></span>
    <div><h1>Ghost Data Audit — Pipeline</h1><div class="sub">live from build/ artifacts</div></div>
  </div>
  <div class="metric glow-ok"><div class="v" id="m-status">—</div><div class="l">Status acc.</div></div>
  <div class="metric glow-ok"><div class="v" id="m-f1">—</div><div class="l">Step F1</div></div>
  <div class="metric"><div class="v" id="m-seq">—</div><div class="l">Sequence acc.</div></div>
  <div class="metric">
    <div class="v" id="m-status-dist">—</div><div class="l">Cases by status</div>
    <div class="metric-bar" id="status-bar"></div>
  </div>
  <div class="metric glow-llm"><div class="v" id="m-llm">—</div><div class="l">LLM calls / cost</div></div>
  <div class="toolbar">
    <select id="case-search"><option value="">Select a case…</option></select>
    <button id="run-btn" title="Animate a case's path through the pipeline">▶ Run</button>
  </div>
</header>
<main>
  <div id="viewport">
    <div id="canvas"><svg id="flow"></svg></div>
    <div class="zoom-ctl">
      <button id="zoom-in">+</button>
      <button id="zoom-reset">⟲</button>
      <button id="zoom-out">–</button>
    </div>
    <div class="hint">drag to pan · scroll to zoom</div>
  </div>
  <div id="panel"><div id="panel-inner"><p class="muted">Click a node, or pick a case above.</p></div></div>
</main>

<script>
const NODE_W = 220, NODE_H = 104, GAP_X = 92, PAD = 60;
const KIND_COLOR = { Deterministic:'#2dd4bf', LLM:'#a78bfa', Validation:'#4ade80', Data:'#94a3b8' };
const KIND_ICON = { Deterministic:'⚙️', LLM:'✨', Validation:'✅', Data:'🗂️' };
const STATUS_COLOR = { COMPLETE:'#4ade80', INCOMPLETE:'#fbbf24', NOT_APPLICABLE:'#94a3b8' };
const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

let pan = {x:40, y:40}, zoom = 1, dragging = false, dragStart = null;

fetch('pipeline.json').then(r => r.json()).then(renderAll).catch(err => {
  document.getElementById('panel-inner').innerHTML =
    '<p class="muted">Could not load pipeline.json: ' + err + '</p>';
});

function renderAll(data){
  window.__pipeline = data;
  const m = data.metrics || {};
  animateCount('m-status', pct(m.status_accuracy));
  animateCount('m-f1', pct(m.step_f1));
  animateCount('m-seq', pct(m.sequence_accuracy));
  setText('m-llm', (m.llm_calls ?? '—') + ' · $' + (m.llm_cost_usd ?? 0).toFixed(4));

  const sc = data.status_counts || {};
  const total = Object.values(sc).reduce((a,b)=>a+b,0) || 1;
  setText('m-status-dist', Object.entries(sc).map(([k,v]) => v + ' ' + k.slice(0,4)).join(' / '));
  const bar = document.getElementById('status-bar');
  bar.innerHTML = Object.entries(sc).map(([k,v]) =>
    `<span style="background:${STATUS_COLOR[k]||'#888'};width:0%" data-w="${(v/total*100).toFixed(1)}"></span>`).join('');
  requestAnimationFrame(() => requestAnimationFrame(() => {
    bar.querySelectorAll('span').forEach(s => s.style.width = s.dataset.w + '%');
  }));

  renderFlow(data.nodes, data.edges);
  renderCaseDropdown(data.cases);
  setupViewportControls();

  document.getElementById('case-search').addEventListener('change', e => {
    const c = data.cases.find(c => c.case_id === e.target.value);
    if (c) { renderCasePanel(c, data.nodes); animatePath(); }
  });
  document.getElementById('run-btn').addEventListener('click', () => {
    const sel = document.getElementById('case-search');
    if (!sel.value) sel.value = data.cases[Math.floor(Math.random()*data.cases.length)].case_id;
    sel.dispatchEvent(new Event('change'));
  });
}

function pct(v){ return (v == null) ? '—' : (v*100).toFixed(1) + '%'; }
function setText(id, v){ document.getElementById(id).textContent = v; }

function animateCount(id, finalText){
  const el = document.getElementById(id);
  const target = parseFloat(finalText);
  if (isNaN(target) || reduced){ el.textContent = finalText; return; }
  const dur = 900, start = performance.now();
  function tick(now){
    const t = Math.min(1, (now-start)/dur);
    const eased = 1 - Math.pow(1-t, 3);
    el.textContent = (target*eased).toFixed(1) + '%';
    if (t < 1) requestAnimationFrame(tick); else el.textContent = finalText;
  }
  requestAnimationFrame(tick);
}

function applyTransform(){
  document.getElementById('canvas').style.transform =
    `translate(${pan.x}px, ${pan.y}px) scale(${zoom})`;
}

function setupViewportControls(){
  const vp = document.getElementById('viewport');
  vp.addEventListener('pointerdown', e => {
    if (e.target.closest('.node-card')) return;
    dragging = true; vp.classList.add('dragging');
    dragStart = {x:e.clientX - pan.x, y:e.clientY - pan.y};
  });
  window.addEventListener('pointermove', e => {
    if (!dragging) return;
    pan.x = e.clientX - dragStart.x; pan.y = e.clientY - dragStart.y;
    applyTransform();
  });
  window.addEventListener('pointerup', () => { dragging = false; vp.classList.remove('dragging'); });
  vp.addEventListener('wheel', e => {
    e.preventDefault();
    zoom = Math.min(1.6, Math.max(0.45, zoom - e.deltaY*0.0012));
    applyTransform();
  }, {passive:false});
  document.getElementById('zoom-in').onclick = () => { zoom = Math.min(1.6, zoom+0.12); applyTransform(); };
  document.getElementById('zoom-out').onclick = () => { zoom = Math.max(0.45, zoom-0.12); applyTransform(); };
  document.getElementById('zoom-reset').onclick = () => { zoom = 1; pan = {x:40,y:40}; applyTransform(); };
  applyTransform();
}

function renderFlow(nodes, edges){
  const svg = document.getElementById('flow');
  const total_w = PAD*2 + nodes.length*(NODE_W+GAP_X);
  const total_h = 280;
  svg.setAttribute('width', total_w);
  svg.setAttribute('height', total_h);
  svg.innerHTML = '';

  const pos = {};
  nodes.forEach((n, i) => { pos[n.id] = { x: PAD + i*(NODE_W+GAP_X), y: total_h/2 - NODE_H/2 }; });
  window.__pos = pos;

  edges.forEach((e, idx) => {
    const a = pos[e.from], b = pos[e.to];
    if (!a || !b) return;
    const x1 = a.x + NODE_W, y1 = a.y + NODE_H/2;
    const x2 = b.x, y2 = b.y + NODE_H/2;
    const midx = (x1+x2)/2;
    const d = `M ${x1} ${y1} C ${midx} ${y1}, ${midx} ${y2}, ${x2} ${y2}`;
    const pathId = 'edgepath-' + idx;

    const glow = document.createElementNS('http://www.w3.org/2000/svg','path');
    glow.setAttribute('d', d); glow.setAttribute('class', 'edge-glow'); glow.setAttribute('id', 'glow-'+idx);
    glow.setAttribute('stroke', '#7c5cff');
    svg.appendChild(glow);

    const path = document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d', d); path.setAttribute('id', pathId);
    path.setAttribute('class', 'edge' + (reduced ? '' : ' anim'));
    svg.appendChild(path);

    if (!reduced){
      [0, 0.5].forEach(offset => {
        const dot = document.createElementNS('http://www.w3.org/2000/svg','circle');
        dot.setAttribute('r', 3.2); dot.setAttribute('fill', '#8fa3ff'); dot.setAttribute('class','particle');
        const anim = document.createElementNS('http://www.w3.org/2000/svg','animateMotion');
        anim.setAttribute('dur', (3.4 + idx%3*0.6) + 's');
        anim.setAttribute('repeatCount', 'indefinite');
        anim.setAttribute('begin', (offset*3.4) + 's');
        const mpath = document.createElementNS('http://www.w3.org/2000/svg','mpath');
        mpath.setAttributeNS('http://www.w3.org/1999/xlink', 'href', '#'+pathId);
        anim.appendChild(mpath);
        dot.appendChild(anim);
        svg.appendChild(dot);
      });
    }

    if (e.count != null) {
      const label = document.createElementNS('http://www.w3.org/2000/svg','text');
      label.setAttribute('x', midx); label.setAttribute('y', (y1+y2)/2 - 8);
      label.setAttribute('text-anchor', 'middle'); label.setAttribute('class', 'edge-label');
      label.textContent = e.count;
      svg.appendChild(label);
    }
  });

  const canvas = document.getElementById('canvas');
  canvas.querySelectorAll('.node-card').forEach(el => el.remove());

  nodes.forEach((n, i) => {
    const el = document.createElement('div');
    el.className = 'node-card';
    el.style.left = pos[n.id].x + 'px';
    el.style.top = pos[n.id].y + 'px';
    el.style.setProperty('--kind-color', KIND_COLOR[n.kind] || '#6c8cff');
    el.style.animationDelay = (i*0.07) + 's';
    el.dataset.id = n.id;
    el.innerHTML = `
      <span class="badge ${n.kind}">${KIND_ICON[n.kind]||''} ${n.kind}</span>
      <div class="node-title">${n.label}</div>
      <div class="node-file">${n.file}::${n.function}</div>
      <div class="node-counts"><span>${n.count_in != null ? 'in '+n.count_in : ''}</span><span>${n.count_out != null ? 'out '+n.count_out+' →' : ''}</span></div>
    `;
    el.addEventListener('click', () => renderNodePanel(n));
    canvas.appendChild(el);
  });
}

function renderCaseDropdown(cases){
  const sel = document.getElementById('case-search');
  cases.slice(0, 2000).forEach(c => {
    const opt = document.createElement('option');
    opt.value = c.case_id;
    opt.textContent = `${c.case_id} — ${c.status}`;
    sel.appendChild(opt);
  });
}

function stateClass(state){
  return ['ABSENT','PRESENT','REDACTED','ANONYMIZED'].includes(state) ? state : 'default';
}

function renderNodePanel(n){
  document.querySelectorAll('.node-card').forEach(el => {
    el.classList.toggle('selected', el.dataset.id === n.id);
    el.classList.remove('pulse'); void el.offsetWidth;
    if (el.dataset.id === n.id) el.classList.add('pulse');
  });

  let extra = '';
  if (n.kind === 'LLM') {
    extra = `<div class="section"><h3>LLM usage</h3>
      <p class="muted">${n.llm_calls ?? 0} calls, ${n.llm_tokens ?? 0} tokens</p></div>`;
  }
  if (n.by_source) {
    extra += `<div class="section"><h3>Observations by source</h3>` +
      Object.entries(n.by_source).map(([k,v]) => `<div class="resource-row"><span>${k}</span><span>${v}</span></div>`).join('') +
      `</div>`;
  }
  if (n.status_counts) {
    extra += `<div class="section"><h3>Status distribution</h3>` +
      Object.entries(n.status_counts).map(([k,v]) =>
        `<div class="resource-row"><span><span class="sdot" style="background:${STATUS_COLOR[k]};box-shadow:0 0 6px ${STATUS_COLOR[k]};display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;"></span>${k}</span><span>${v}</span></div>`).join('') +
      `</div>`;
  }

  setPanel(`
    <span class="badge ${n.kind}">${KIND_ICON[n.kind]||''} ${n.kind}</span>
    <h2>${n.label}</h2>
    <div class="node-file" style="margin-bottom:12px">${n.file}::${n.function}</div>
    <div class="section"><p class="muted">${n.desc}</p></div>
    ${extra}
  `);
}

function renderCasePanel(c){
  const steps = [...c.steps].sort((a,b) => a.step_no - b.step_no);
  const dotColor = {FINDING:'#f87171', REMEDIATION:'#fbbf24', VERIFICATION:'#4ade80'};

  const resourcesHtml = c.resources.map(r => `
    <div class="resource-row">
      <span>${r.system_id} / ${r.resource_id}</span>
      <span><span class="state-tag ${stateClass(r.state)}">${r.state}</span>${r.evidence_id ? ' <span class="muted">'+r.evidence_id+'</span>' : ''}</span>
    </div>`).join('') || '<p class="muted">No resources resolved.</p>';

  const stepsHtml = steps.map(s => `
    <div class="step-row" style="--dot-color:${dotColor[s.phase]||'#888'}">
      <span class="chip ${s.phase}">${s.phase}</span>
      <div style="margin-top:4px"><strong>${s.operation}</strong></div>
      <div class="mono">${s.system_id} / ${s.resource_id} → ${s.state}${s.evidence_id ? ' (evidence: ' + s.evidence_id + ')' : ''}</div>
    </div>`).join('');

  setPanel(`
    <h2>${c.case_id}</h2>
    <div class="section">
      <span class="status-pill ${c.status}"><span class="sdot"></span>${c.status}</span>
    </div>
    <div class="section">
      <h3>Identity</h3>
      <div class="resource-row"><span>user_id</span><span>${c.user_id ?? '—'}</span></div>
      <div class="resource-row"><span>account_id</span><span>${c.account_id ?? '—'}</span></div>
      <div class="resource-row"><span>account rule</span><span>${c.account_rule ?? '—'}</span></div>
      <div class="resource-row"><span>audit_record_id</span><span>${c.audit_record_id ?? '—'}</span></div>
    </div>
    <div class="section"><h3>Resources</h3>${resourcesHtml}</div>
    <div class="section"><h3>Step timeline</h3><div class="timeline">${stepsHtml || '<p class="muted">No steps (clean case).</p>'}</div></div>
  `);
}

function setPanel(html){
  const inner = document.getElementById('panel-inner');
  inner.style.animation = 'none'; void inner.offsetWidth;
  inner.innerHTML = html;
  inner.style.animation = `panelIn calc(.3s * var(--dur-base)) ease forwards`;
}

function animatePath(){
  const order = window.__pipeline.nodes.map(n => n.id);
  document.querySelectorAll('.node-card').forEach(el => el.classList.remove('selected','pulse'));
  const svg = document.getElementById('flow');
  svg.querySelectorAll('.edge-glow').forEach(g => g.classList.remove('lit'));

  order.forEach((id, i) => {
    setTimeout(() => {
      const card = document.querySelector(`.node-card[data-id="${id}"]`);
      if (card){ card.classList.add('selected'); card.classList.add('pulse');
        setTimeout(() => card.classList.remove('pulse'), 900); }
      const glow = document.getElementById('glow-'+i);
      if (glow) glow.classList.add('lit');
    }, reduced ? 0 : i * 180);
  });
}
</script>
</body>
</html>
