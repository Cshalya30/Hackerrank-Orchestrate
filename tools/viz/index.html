<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ghost Data Audit — Pipeline Visualizer</title>
<style>
  :root{
    --bg:#0f1115; --grid:#1a1d24; --card:#161922; --card-border:#262b36;
    --text:#e6e8ee; --muted:#8b93a3; --accent:#5b8cff;
    --teal:#2dd4bf; --violet:#a78bfa; --green:#4ade80; --slate:#94a3b8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    font-size:14px;
    background-image:radial-gradient(circle,var(--grid) 1px,transparent 1px);
    background-size:22px 22px;
  }
  header{
    display:flex; flex-wrap:wrap; gap:12px; padding:16px 20px;
    border-bottom:1px solid var(--card-border); align-items:center;
  }
  header h1{font-size:16px; margin:0; margin-right:16px; white-space:nowrap;}
  .metric{
    background:var(--card); border:1px solid var(--card-border); border-radius:10px;
    padding:8px 14px; min-width:90px;
  }
  .metric .v{font-size:18px; font-weight:700;}
  .metric .l{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em;}
  #case-search{
    margin-left:auto; background:var(--card); border:1px solid var(--card-border);
    color:var(--text); border-radius:8px; padding:8px 10px; min-width:220px; font-size:13px;
  }
  main{display:flex; height:calc(100vh - 68px);}
  #flow-wrap{flex:1; overflow:auto; position:relative;}
  svg#flow{display:block;}
  .node-card{
    position:absolute; width:220px; border-radius:12px; border:1px solid var(--card-border);
    background:var(--card); padding:10px 12px; cursor:pointer; transition:border-color .15s, transform .15s;
  }
  .node-card:hover{border-color:var(--accent); transform:translateY(-2px);}
  .node-card.selected{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent);}
  .badge{
    display:inline-block; font-size:10px; padding:2px 7px; border-radius:999px; margin-bottom:6px;
    text-transform:uppercase; letter-spacing:.03em; font-weight:700;
  }
  .badge.Deterministic{background:rgba(45,212,191,.15); color:var(--teal);}
  .badge.LLM{background:rgba(167,139,250,.15); color:var(--violet);}
  .badge.Validation{background:rgba(74,222,128,.15); color:var(--green);}
  .badge.Data{background:rgba(148,163,184,.15); color:var(--slate);}
  .node-title{font-weight:600; font-size:13px; margin-bottom:4px;}
  .node-file{font-family:ui-monospace,Consolas,monospace; font-size:11px; color:var(--muted); word-break:break-all;}
  .node-counts{font-size:11px; color:var(--muted); margin-top:6px;}
  #panel{
    width:340px; border-left:1px solid var(--card-border); padding:16px; overflow-y:auto;
    flex-shrink:0;
  }
  #panel h2{font-size:15px; margin:0 0 8px;}
  #panel .section{margin-bottom:16px;}
  #panel .section h3{font-size:11px; text-transform:uppercase; color:var(--muted); margin:0 0 6px;}
  .chip{display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:700; margin-right:4px; margin-bottom:4px;}
  .chip.FINDING{background:rgba(248,113,113,.15); color:#f87171;}
  .chip.REMEDIATION{background:rgba(251,191,36,.15); color:#fbbf24;}
  .chip.VERIFICATION{background:rgba(74,222,128,.15); color:#4ade80;}
  .step-row{border:1px solid var(--card-border); border-radius:8px; padding:8px; margin-bottom:6px; font-size:12px;}
  .step-row .mono{font-family:ui-monospace,Consolas,monospace; color:var(--muted); font-size:11px;}
  .resource-row{display:flex; justify-content:space-between; font-size:12px; padding:4px 0; border-bottom:1px solid var(--card-border);}
  .muted{color:var(--muted); font-size:12px;}
  .example{font-size:12px; color:var(--muted); margin-bottom:4px; padding-left:8px; border-left:2px solid var(--card-border);}
  path.edge{fill:none; stroke:#3a4150; stroke-width:1.6; stroke-dasharray:6 5;}
  path.edge.anim{animation:dash 1.2s linear infinite;}
  @keyframes dash{to{stroke-dashoffset:-11;}}
  text.edge-label{fill:var(--muted); font-size:10px; font-family:ui-monospace,Consolas,monospace;}
  @media (prefers-reduced-motion: reduce){ path.edge.anim{animation:none;} }
</style>
</head>
<body>
<header>
  <h1>Ghost Data Audit — Pipeline</h1>
  <div class="metric"><div class="v" id="m-status">—</div><div class="l">Status acc.</div></div>
  <div class="metric"><div class="v" id="m-f1">—</div><div class="l">Step F1</div></div>
  <div class="metric"><div class="v" id="m-seq">—</div><div class="l">Sequence acc.</div></div>
  <div class="metric"><div class="v" id="m-status-dist">—</div><div class="l">Cases by status</div></div>
  <div class="metric"><div class="v" id="m-llm">—</div><div class="l">LLM calls / cost</div></div>
  <select id="case-search"><option value="">Select a case…</option></select>
</header>
<main>
  <div id="flow-wrap"><svg id="flow"></svg></div>
  <div id="panel"><p class="muted">Click a node, or pick a case above.</p></div>
</main>

<script>
const NODE_W = 220, NODE_H = 100, GAP_X = 90, PAD = 40;

fetch('pipeline.json').then(r => r.json()).then(renderAll).catch(err => {
  document.getElementById('panel').innerHTML =
    '<p class="muted">Could not load pipeline.json: ' + err + '</p>';
});

function renderAll(data){
  // Header metrics
  const m = data.metrics || {};
  setText('m-status', pct(m.status_accuracy));
  setText('m-f1', pct(m.step_f1));
  setText('m-seq', pct(m.sequence_accuracy));
  const sc = data.status_counts || {};
  setText('m-status-dist', Object.entries(sc).map(([k,v]) => v + ' ' + k.slice(0,4)).join(' / '));
  setText('m-llm', (m.llm_calls ?? '—') + ' / $' + (m.llm_cost_usd ?? 0).toFixed(4));

  renderFlow(data.nodes, data.edges);
  renderCaseDropdown(data.cases);

  document.getElementById('case-search').addEventListener('change', e => {
    const c = data.cases.find(c => c.case_id === e.target.value);
    if (c) renderCasePanel(c, data.nodes);
  });

  window.__pipeline = data;
}

function pct(v){ return (v == null) ? '—' : (v*100).toFixed(1) + '%'; }
function setText(id, v){ document.getElementById(id).textContent = v; }

function renderFlow(nodes, edges){
  const svg = document.getElementById('flow');
  const total_w = PAD*2 + nodes.length*(NODE_W+GAP_X);
  const total_h = 320;
  svg.setAttribute('width', total_w);
  svg.setAttribute('height', total_h);
  svg.innerHTML = '';

  const pos = {};
  nodes.forEach((n, i) => {
    pos[n.id] = { x: PAD + i*(NODE_W+GAP_X), y: total_h/2 - NODE_H/2 };
  });

  // Edges first (so cards sit above them)
  const defs = document.createElementNS('http://www.w3.org/2000/svg','defs');
  svg.appendChild(defs);

  edges.forEach(e => {
    const a = pos[e.from], b = pos[e.to];
    if (!a || !b) return;
    const x1 = a.x + NODE_W, y1 = a.y + NODE_H/2;
    const x2 = b.x, y2 = b.y + NODE_H/2;
    const midx = (x1+x2)/2;
    const path = document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d', `M ${x1} ${y1} C ${midx} ${y1}, ${midx} ${y2}, ${x2} ${y2}`);
    path.setAttribute('class', 'edge anim');
    svg.appendChild(path);
    if (e.count != null) {
      const label = document.createElementNS('http://www.w3.org/2000/svg','text');
      label.setAttribute('x', midx);
      label.setAttribute('y', (y1+y2)/2 - 6);
      label.setAttribute('text-anchor', 'middle');
      label.setAttribute('class', 'edge-label');
      label.textContent = e.count;
      svg.appendChild(label);
    }
  });

  const wrap = document.getElementById('flow-wrap');
  // Remove old cards
  wrap.querySelectorAll('.node-card').forEach(el => el.remove());

  nodes.forEach(n => {
    const el = document.createElement('div');
    el.className = 'node-card';
    el.style.left = pos[n.id].x + 'px';
    el.style.top = pos[n.id].y + 'px';
    el.dataset.id = n.id;
    el.innerHTML = `
      <span class="badge ${n.kind}">${n.kind}</span>
      <div class="node-title">${n.label}</div>
      <div class="node-file">${n.file}::${n.function}</div>
      <div class="node-counts">${n.count_in != null ? 'in '+n.count_in : ''} ${n.count_out != null ? '→ out '+n.count_out : ''}</div>
    `;
    el.addEventListener('click', () => renderNodePanel(n));
    wrap.appendChild(el);
  });
}

function renderCaseDropdown(cases){
  const sel = document.getElementById('case-search');
  cases.slice(0, 2000).forEach(c => {
    const opt = document.createElement('option');
    opt.value = c.case_id;
    opt.textContent = `${c.case_id} — ${c.status}`;
    sel.appendChild(opt);
  });
}

function renderNodePanel(n){
  document.querySelectorAll('.node-card').forEach(el =>
    el.classList.toggle('selected', el.dataset.id === n.id));

  let extra = '';
  if (n.kind === 'LLM') {
    extra = `<div class="section"><h3>LLM usage</h3>
      <p class="muted">${n.llm_calls ?? 0} calls, ${n.llm_tokens ?? 0} tokens</p></div>`;
  }
  if (n.by_source) {
    extra += `<div class="section"><h3>Observations by source</h3>` +
      Object.entries(n.by_source).map(([k,v]) => `<div class="resource-row"><span>${k}</span><span>${v}</span></div>`).join('') +
      `</div>`;
  }
  if (n.status_counts) {
    extra += `<div class="section"><h3>Status distribution</h3>` +
      Object.entries(n.status_counts).map(([k,v]) => `<div class="resource-row"><span>${k}</span><span>${v}</span></div>`).join('') +
      `</div>`;
  }

  document.getElementById('panel').innerHTML = `
    <span class="badge ${n.kind}">${n.kind}</span>
    <h2>${n.label}</h2>
    <div class="node-file" style="margin-bottom:10px">${n.file}::${n.function}</div>
    <div class="section"><p class="muted">${n.desc}</p></div>
    ${extra}
  `;
}

function renderCasePanel(c, nodes){
  const phaseOrder = {FINDING:0, REMEDIATION:1, VERIFICATION:2};
  const steps = [...c.steps].sort((a,b) => a.step_no - b.step_no);

  const resourcesHtml = c.resources.map(r => `
    <div class="resource-row">
      <span>${r.system_id} / ${r.resource_id}</span>
      <span>${r.state}${r.evidence_id ? ' · ' + r.evidence_id : ''}</span>
    </div>`).join('') || '<p class="muted">No resources resolved.</p>';

  const stepsHtml = steps.map(s => `
    <div class="step-row">
      <span class="chip ${s.phase}">${s.phase}</span>
      <div><strong>${s.operation}</strong></div>
      <div class="mono">${s.system_id} / ${s.resource_id} → ${s.state}${s.evidence_id ? ' (evidence: ' + s.evidence_id + ')' : ''}</div>
    </div>`).join('') || '<p class="muted">No steps (clean case).</p>';

  document.getElementById('panel').innerHTML = `
    <h2>${c.case_id}</h2>
    <div class="section">
      <h3>Status</h3>
      <p><strong>${c.status}</strong></p>
    </div>
    <div class="section">
      <h3>Identity</h3>
      <div class="resource-row"><span>user_id</span><span>${c.user_id ?? '—'}</span></div>
      <div class="resource-row"><span>account_id</span><span>${c.account_id ?? '—'}</span></div>
      <div class="resource-row"><span>account rule</span><span>${c.account_rule ?? '—'}</span></div>
      <div class="resource-row"><span>audit_record_id</span><span>${c.audit_record_id ?? '—'}</span></div>
    </div>
    <div class="section"><h3>Resources</h3>${resourcesHtml}</div>
    <div class="section"><h3>Step timeline</h3>${stepsHtml}</div>
  `;

  // Highlight the full flow path for a case (simple: select every node)
  document.querySelectorAll('.node-card').forEach(el => el.classList.add('selected'));
}
</script>
</body>
</html>
