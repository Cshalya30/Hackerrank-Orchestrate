<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ghost Data — Pipeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===========================================================
   LAYOUT CONCEPT — a dark, maximalist flow canvas over a fixed
   aurora mesh: a bold stat marquee up top, nodes connected by
   glowing gradient edges with traveling light, a glass detail
   rail on the right. Motion personality: Premium (0.4,0,0.2,1),
   350-600ms, 0% overshoot) with Energetic accents on the comet
   trace. Three layers everywhere: primary action, secondary
   glow/shadow, ambient mesh drift.
   =========================================================== */
:root{
  --bg:          #07060c;
  --surface:     rgba(255,255,255,.045);
  --surface-hi:  rgba(255,255,255,.08);
  --border:      rgba(255,255,255,.09);
  --border-hi:   rgba(255,255,255,.18);
  --text:        #f3f1fb;
  --text-dim:    #a9a2c9;
  --text-faint:  #6d668f;
  --cyan:        #2dd9e8;
  --violet:      #9b7bff;
  --emerald:     #3ee49b;
  --amber:       #ffb545;
  --coral:       #ff6d5a;
  --ease:        cubic-bezier(.4,0,.2,1);
  --font-display:'Bricolage Grotesque', -apple-system, sans-serif;
  --font-mono:   'JetBrains Mono', ui-monospace, Consolas, monospace;
  --dur:1;
}
@media (prefers-reduced-motion: reduce){ :root{ --dur:1000; } }
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--text); font-family:var(--font-display);
  font-size:14px; overflow:hidden; display:flex; flex-direction:column;
}

/* ---------- ambient aurora mesh (fixed, slow drift) ---------- */
.mesh{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;}
.bloom{position:absolute; border-radius:50%; filter:blur(110px); opacity:.5; mix-blend-mode:screen;
  animation:driftA calc(52s*var(--dur)) ease-in-out infinite;}
.bloom.b1{width:620px; height:620px; background:var(--violet); top:-220px; left:-140px;}
.bloom.b2{width:560px; height:560px; background:var(--coral); bottom:-240px; right:-120px;
  animation-name:driftB; animation-duration:calc(60s*var(--dur)); animation-delay:-18s;}
.bloom.b3{width:460px; height:460px; background:var(--cyan); top:38%; left:62%; opacity:.32;
  animation-duration:calc(70s*var(--dur)); animation-delay:-30s;}
@keyframes driftA{0%,100%{transform:translate(0,0);} 50%{transform:translate(70px,50px);}}
@keyframes driftB{0%,100%{transform:translate(0,0);} 50%{transform:translate(-60px,-40px);}}
.grain{position:fixed; inset:0; z-index:0; opacity:.035; pointer-events:none;}
.vignette{position:fixed; inset:0; z-index:0; pointer-events:none; box-shadow:inset 0 0 260px 40px rgba(0,0,0,.6);}

/* ---------- header ---------- */
header{position:relative; z-index:3; flex-shrink:0; padding:20px 28px 16px; border-bottom:1px solid var(--border);}
.top-row{display:flex; align-items:center; gap:14px; margin-bottom:18px;}
.brand{display:flex; align-items:center; gap:10px;}
.mark{width:30px; height:30px; border-radius:9px; background:linear-gradient(135deg,var(--violet),var(--coral));
  display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12px; color:#fff;
  box-shadow:0 0 22px -4px var(--violet);}
h1{font-size:17px; font-weight:700; margin:0; letter-spacing:-.01em;
  background:linear-gradient(90deg,#fff,#cabfff 70%); -webkit-background-clip:text; background-clip:text; color:transparent;}
.live{margin-left:auto; display:flex; align-items:center; gap:7px; font-family:var(--font-mono); font-size:11px;
  color:var(--emerald); background:rgba(62,228,155,.1); border:1px solid rgba(62,228,155,.25); padding:5px 11px; border-radius:999px;}
.live .dot{width:6px; height:6px; border-radius:50%; background:var(--emerald); box-shadow:0 0 8px var(--emerald);
  animation:breathe calc(2.2s*var(--dur)) ease-in-out infinite;}
@keyframes breathe{0%,100%{opacity:1; transform:scale(1);} 50%{opacity:.4; transform:scale(.75);}}

.toolbar{display:flex; align-items:center; gap:10px;}
#case-search{
  font-family:var(--font-mono); font-size:12.5px; background:var(--surface); border:1px solid var(--border);
  color:var(--text); border-radius:8px; padding:9px 13px; min-width:210px;
}
#case-search:focus{outline:none; border-color:var(--violet); box-shadow:0 0 0 3px rgba(155,123,255,.18);}
#run-btn{
  font-family:var(--font-display); font-weight:700; font-size:12.5px; color:#fff; border:none; border-radius:8px;
  padding:9px 18px; cursor:pointer; background:linear-gradient(135deg,var(--violet),var(--coral));
  box-shadow:0 6px 20px -6px rgba(155,123,255,.6); transition:transform .15s var(--ease), box-shadow .15s var(--ease);
}
#run-btn:hover{transform:translateY(-1px); box-shadow:0 10px 26px -6px rgba(155,123,255,.75);}
#run-btn:active{transform:translateY(0) scale(.97);}

.stat-row{display:flex; gap:10px; flex-wrap:wrap;}
.stat-tile{
  flex:1; min-width:130px; background:var(--surface); border:1px solid var(--border); border-radius:12px;
  padding:13px 16px; backdrop-filter:blur(16px); position:relative; overflow:hidden;
  opacity:0; transform:translateY(14px); animation:tileIn calc(.45s*var(--dur)) var(--ease) forwards;
}
@keyframes tileIn{to{opacity:1; transform:translateY(0);}}
.stat-tile::after{content:""; position:absolute; left:0; right:0; bottom:0; height:2px; background:var(--tile-color,var(--violet));
  box-shadow:0 0 10px var(--tile-color,var(--violet));}
.stat-tile .l{font-family:var(--font-mono); font-size:10px; letter-spacing:.07em; text-transform:uppercase; color:var(--text-faint);}
.stat-tile .n{font-size:27px; font-weight:700; margin-top:3px; letter-spacing:-.02em; font-variant-numeric:tabular-nums;}
.stat-tile .n small{font-size:13px; color:var(--text-faint); font-weight:500; margin-left:4px;}

.dist-row{display:flex; align-items:center; gap:14px; margin-top:12px;}
.dist-bar{flex:1; display:flex; height:7px; border-radius:5px; overflow:hidden; background:rgba(255,255,255,.06);}
.dist-bar span{height:100%; width:0; transition:width calc(1s*var(--dur)) var(--ease);}
.dist-legend{display:flex; gap:16px; font-family:var(--font-mono); font-size:11px; color:var(--text-dim);}
.dist-legend b{color:var(--text);}
.dist-legend .sw{display:inline-block; width:7px; height:7px; border-radius:2px; margin-right:5px;}

/* ---------- canvas ---------- */
main{position:relative; z-index:1; display:flex; flex:1; min-height:0;}
#viewport{flex:1; position:relative; overflow:hidden; cursor:grab;}
#viewport.dragging{cursor:grabbing;}
#canvas{position:absolute; top:0; left:0; transform-origin:0 0; will-change:transform;}
svg#flow{display:block; overflow:visible;}

.zoom-ctl{position:absolute; right:14px; bottom:14px; z-index:2; display:flex; flex-direction:column; gap:6px;
  background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:6px; backdrop-filter:blur(12px);}
.zoom-ctl button{width:28px; height:28px; border-radius:6px; border:none; background:transparent; color:var(--text-dim);
  cursor:pointer; font-family:var(--font-mono); font-size:13px;}
.zoom-ctl button:hover{color:var(--violet); background:rgba(255,255,255,.06);}
.hint{position:absolute; left:14px; bottom:14px; z-index:2; font-family:var(--font-mono); font-size:10px; color:var(--text-faint);}

.node{
  position:absolute; width:222px; border-radius:14px; background:var(--surface); border:1px solid var(--border);
  padding:14px 15px 12px; cursor:pointer; backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
  box-shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 20px 40px -24px rgba(0,0,0,.6);
  transition:border-color .2s var(--ease), transform .2s var(--ease), box-shadow .2s var(--ease);
}
/* entrance is a one-shot class, removed on animationend -- it must NOT live on
   the base .node rule, because any later rule that reassigns `animation`
   (e.g. .node.lit) would strip nodeIn's `forwards` hold and the element would
   fall back to this rule's own opacity, going invisible. */
.node.entering{opacity:0; transform:translateY(18px) scale(.95);
  animation:nodeIn calc(.5s*var(--dur)) var(--ease) forwards;}
@keyframes nodeIn{to{opacity:1; transform:translateY(0) scale(1);}}
.node::before{content:""; position:absolute; top:0; left:14px; right:14px; height:2px; border-radius:2px;
  background:var(--kc,var(--violet)); box-shadow:0 0 12px var(--kc,var(--violet));}
.node:hover{border-color:var(--border-hi); transform:translateY(-4px);
  box-shadow:0 26px 48px -20px rgba(0,0,0,.7), 0 0 0 1px var(--border-hi);}
.node.selected{border-color:var(--kc,var(--violet)); box-shadow:0 0 0 1.5px var(--kc,var(--violet)), 0 0 32px -6px var(--kc,var(--violet));}
.node.lit{animation:litPulse calc(.6s*var(--dur)) var(--ease);}
@keyframes litPulse{0%{box-shadow:0 0 0 0 var(--kc,var(--violet));} 50%{box-shadow:0 0 0 10px transparent, 0 0 40px 4px var(--kc,var(--violet));} 100%{box-shadow:0 0 0 0 transparent;}}

.node-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:9px;}
.kind-chip{font-family:var(--font-mono); font-size:9.5px; font-weight:700; letter-spacing:.07em; text-transform:uppercase;
  padding:2.5px 7px; border-radius:5px; color:var(--kc,var(--violet)); background:color-mix(in srgb, var(--kc,var(--violet)) 15%, transparent);}
.node-no{font-family:var(--font-mono); font-size:10px; color:var(--text-faint);}
.node-title{font-weight:700; font-size:14.5px; margin-bottom:4px; letter-spacing:-.005em;}
.node-file{font-family:var(--font-mono); font-size:10px; color:var(--text-dim); line-height:1.4;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
.node-counts{display:flex; justify-content:space-between; font-family:var(--font-mono); font-size:10px; color:var(--text-faint);
  margin-top:10px; padding-top:8px; border-top:1px solid var(--border);}

path.edge-base{fill:none; stroke:rgba(255,255,255,.1); stroke-width:1.6;}
path.edge-glow{fill:none; stroke-width:5; opacity:0; filter:blur(4px); transition:opacity .25s;}
path.edge-glow.lit{opacity:.55;}
.comet{filter:drop-shadow(0 0 6px currentColor) drop-shadow(0 0 14px currentColor);}
text.edge-count{font-family:var(--font-mono); font-size:9.5px; fill:var(--text-faint);}

/* ---------- side panel ---------- */
#panel{width:360px; border-left:1px solid var(--border); overflow-y:auto; flex-shrink:0; background:rgba(10,9,18,.5); backdrop-filter:blur(20px);}
#panel-inner{padding:22px; opacity:0; transform:translateY(6px); animation:panelIn calc(.3s*var(--dur)) var(--ease) forwards;}
@keyframes panelIn{to{opacity:1; transform:translateY(0);}}
.panel-kicker{font-family:var(--font-mono); font-size:10px; letter-spacing:.09em; text-transform:uppercase; color:var(--text-faint); margin-bottom:6px;}
#panel h2{font-size:20px; font-weight:700; margin:0 0 5px; letter-spacing:-.01em;}
.panel-file{font-family:var(--font-mono); font-size:11px; color:var(--text-dim); margin-bottom:14px;}
.panel-desc{font-size:12.5px; color:var(--text-dim); line-height:1.65;}
.section{margin-top:22px;}
.section h3{font-family:var(--font-mono); font-size:10px; text-transform:uppercase; letter-spacing:.07em;
  color:var(--text-faint); margin:0 0 10px; padding-bottom:7px; border-bottom:1px solid var(--border);}

.status-pill{font-family:var(--font-mono); font-weight:700; font-size:11.5px; letter-spacing:.04em; text-transform:uppercase;
  display:inline-flex; align-items:center; gap:7px; padding:6px 13px; border-radius:999px; border:1px solid;}
.status-pill .d{width:6px; height:6px; border-radius:50%; background:currentColor; box-shadow:0 0 6px currentColor;}
.status-pill.COMPLETE{color:var(--emerald); border-color:rgba(62,228,155,.4); background:rgba(62,228,155,.08);}
.status-pill.INCOMPLETE{color:var(--amber); border-color:rgba(255,181,69,.4); background:rgba(255,181,69,.08);}
.status-pill.NOT_APPLICABLE{color:var(--text-dim); border-color:var(--border-hi); background:rgba(255,255,255,.04);}

.kv{display:flex; justify-content:space-between; gap:10px; font-family:var(--font-mono); font-size:11.5px;
  padding:7px 0; border-bottom:1px solid var(--border);}
.kv:last-child{border-bottom:none;}
.kv .k{color:var(--text-faint);}
.kv .v{color:var(--text);}
.state-tag{font-family:var(--font-mono); font-size:9.5px; font-weight:700; padding:2px 7px; border-radius:5px;}
.state-tag.ABSENT{color:var(--emerald); background:rgba(62,228,155,.12);}
.state-tag.PRESENT{color:var(--coral); background:rgba(255,109,90,.12);}
.state-tag.REDACTED,.state-tag.ANONYMIZED{color:var(--cyan); background:rgba(45,217,232,.12);}
.state-tag.default{color:var(--text-dim); background:rgba(255,255,255,.06);}

.timeline{position:relative; padding-left:18px;}
.timeline::before{content:""; position:absolute; left:4px; top:4px; bottom:4px; width:2px;
  background:linear-gradient(180deg, var(--coral), var(--amber), var(--emerald));}
.t-item{position:relative; padding:10px 0 10px 12px; margin-bottom:2px; border-radius:8px;}
.t-item::before{content:""; position:absolute; left:-18px; top:14px; width:8px; height:8px; border-radius:50%;
  background:var(--dc,var(--text-faint)); box-shadow:0 0 7px var(--dc,var(--text-faint));}
.phase-tag{font-family:var(--font-mono); font-size:9px; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
  color:var(--dc,var(--text-faint));}
.t-op{font-size:13px; font-weight:600; margin-top:3px;}
.t-detail{font-family:var(--font-mono); font-size:10.5px; color:var(--text-faint); margin-top:3px;}

.muted{color:var(--text-faint); font-size:12px;}
::-webkit-scrollbar{width:8px;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12); border-radius:4px;}

@media (max-width:1024px){
  #panel{width:300px;}
  .stat-tile .n{font-size:22px;}
  h1{font-size:15px;}
}
</style>
</head>
<body>
<div class="mesh"><div class="bloom b1"></div><div class="bloom b2"></div><div class="bloom b3"></div></div>
<svg class="grain" width="0" height="0"><filter id="nz"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2"/></filter></svg>
<div class="grain" style="position:fixed;inset:0;z-index:0;filter:url(#nz)"></div>
<div class="vignette"></div>

<header>
  <div class="top-row">
    <div class="brand"><div class="mark">GD</div><h1>Ghost Data — Pipeline</h1></div>
    <span class="live"><span class="dot"></span>live from build artifacts</span>
  </div>
  <div class="stat-row">
    <div class="stat-tile" style="--tile-color:var(--emerald); animation-delay:.02s">
      <div class="l">Status accuracy</div><div class="n" id="m-status">—</div></div>
    <div class="stat-tile" style="--tile-color:var(--emerald); animation-delay:.08s">
      <div class="l">Step F1</div><div class="n" id="m-f1">—</div></div>
    <div class="stat-tile" style="--tile-color:var(--cyan); animation-delay:.14s">
      <div class="l">Sequence accuracy</div><div class="n" id="m-seq">—</div></div>
    <div class="stat-tile" style="--tile-color:var(--violet); animation-delay:.2s">
      <div class="l">LLM usage</div><div class="n" id="m-llm">—</div></div>
    <div class="stat-tile" style="--tile-color:var(--amber); animation-delay:.26s; flex:1.6;">
      <div class="l">Case status</div>
      <div class="dist-row"><div class="dist-bar" id="dist-bar"></div></div>
      <div class="dist-legend" id="dist-legend" style="margin-top:8px"></div>
    </div>
  </div>
  <div class="toolbar" style="margin-top:14px;">
    <select id="case-search"><option value="">Select a case…</option></select>
    <button id="run-btn">▶ Trace case</button>
  </div>
</header>

<main>
  <div id="viewport">
    <div id="canvas"><svg id="flow"></svg></div>
    <div class="zoom-ctl"><button id="zoom-in">+</button><button id="zoom-reset">⟲</button><button id="zoom-out">–</button></div>
    <div class="hint">drag to pan · scroll to zoom</div>
  </div>
  <div id="panel"><div id="panel-inner">
    <div class="panel-kicker">Instructions</div>
    <h2>Select a node</h2>
    <p class="panel-desc">Click a pipeline stage for its detail, or pick a case above and hit Trace to watch it move through the system.</p>
  </div></div>
</main>

<script>
const NODE_W = 222, NODE_H = 112, GAP_X = 78, PAD = 56;
const KIND_COLOR = { Deterministic:'#2dd9e8', LLM:'#9b7bff', Validation:'#3ee49b', Data:'#ffb545' };
const STATUS_COLOR = { COMPLETE:'#3ee49b', INCOMPLETE:'#ffb545', NOT_APPLICABLE:'#6d668f' };
const PHASE_COLOR = { FINDING:'#ff6d5a', REMEDIATION:'#ffb545', VERIFICATION:'#3ee49b' };
const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

let pan = {x:40,y:30}, zoom = 1, dragging = false, dragStart = null;

fetch('pipeline.json', {cache:'no-store'}).then(r => r.json()).then(renderAll).catch(err => {
  document.getElementById('panel-inner').innerHTML = `<p class="muted">Could not load pipeline.json: ${err}</p>`;
});

function pct(v){ return v == null ? '—' : (v*100).toFixed(1) + '%'; }
function setText(id,v){ document.getElementById(id).textContent = v; }

function renderAll(data){
  window.__pipeline = data;
  const m = data.metrics || {};
  setText('m-status', pct(m.status_accuracy));
  setText('m-f1', pct(m.step_f1));
  setText('m-seq', pct(m.sequence_accuracy));
  document.getElementById('m-llm').innerHTML = `${m.llm_calls ?? 0}<small>calls · $${(m.llm_cost_usd??0).toFixed(3)}</small>`;

  const sc = data.status_counts || {};
  const total = Object.values(sc).reduce((a,b)=>a+b,0) || 1;
  const bar = document.getElementById('dist-bar');
  bar.innerHTML = Object.entries(sc).map(([k,v]) =>
    `<span style="background:${STATUS_COLOR[k]}" data-w="${v/total*100}"></span>`).join('');
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    bar.querySelectorAll('span').forEach(s => s.style.width = s.dataset.w+'%');
  }));
  const STATUS_SHORT = { COMPLETE:'complete', INCOMPLETE:'incomplete', NOT_APPLICABLE:'n/a' };
  document.getElementById('dist-legend').innerHTML = Object.entries(sc).map(([k,v]) =>
    `<span><span class="sw" style="background:${STATUS_COLOR[k]}"></span>${v} <span style="color:var(--text-faint)">${STATUS_SHORT[k]||k}</span></span>`).join('');

  renderFlow(data.nodes, data.edges);
  renderCaseDropdown(data.cases);
  setupViewportControls(data.nodes.length);

  document.getElementById('case-search').addEventListener('change', e => {
    const c = data.cases.find(c => c.case_id === e.target.value);
    if (c){ renderCasePanel(c); traceCase(); }
  });
  document.getElementById('run-btn').addEventListener('click', () => {
    const sel = document.getElementById('case-search');
    if (!sel.value) sel.value = data.cases[Math.floor(Math.random()*data.cases.length)].case_id;
    sel.dispatchEvent(new Event('change'));
  });
}

function applyTransform(){
  document.getElementById('canvas').style.transform = `translate(${pan.x}px,${pan.y}px) scale(${zoom})`;
}

function setupViewportControls(n){
  const vp = document.getElementById('viewport');
  const totalW = PAD*2 + n*(NODE_W+GAP_X);
  const fit = Math.min(1.1, (vp.clientWidth-40)/totalW);
  zoom = Math.max(0.78, fit);
  pan = {x:22, y:Math.max(26,(vp.clientHeight-NODE_H*zoom)/2 - 20)};
  applyTransform();

  vp.addEventListener('pointerdown', e => {
    if (e.target.closest('.node')) return;
    dragging = true; vp.classList.add('dragging'); dragStart = {x:e.clientX-pan.x, y:e.clientY-pan.y};
  });
  window.addEventListener('pointermove', e => {
    if (!dragging) return;
    pan.x = e.clientX-dragStart.x; pan.y = e.clientY-dragStart.y; applyTransform();
  });
  window.addEventListener('pointerup', () => { dragging=false; vp.classList.remove('dragging'); });
  vp.addEventListener('wheel', e => {
    e.preventDefault(); zoom = Math.min(1.6, Math.max(0.45, zoom - e.deltaY*0.0011)); applyTransform();
  }, {passive:false});
  document.getElementById('zoom-in').onclick = () => { zoom = Math.min(1.6, zoom+0.12); applyTransform(); };
  document.getElementById('zoom-out').onclick = () => { zoom = Math.max(0.45, zoom-0.12); applyTransform(); };
  document.getElementById('zoom-reset').onclick = () => { zoom = fit; pan = {x:22,y:26}; applyTransform(); };
}

function edgePath(a,b){
  const x1=a.x+NODE_W, y1=a.y+NODE_H/2, x2=b.x-6, y2=b.y+NODE_H/2, midx=(x1+x2)/2;
  return `M ${x1} ${y1} C ${midx} ${y1}, ${midx} ${y2}, ${x2} ${y2}`;
}

function renderFlow(nodes, edges){
  const svg = document.getElementById('flow');
  const totalW = PAD*2 + nodes.length*(NODE_W+GAP_X), totalH = 280;
  svg.setAttribute('width', totalW); svg.setAttribute('height', totalH);
  svg.innerHTML = `<defs><linearGradient id="edgeGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#9b7bff"/><stop offset="100%" stop-color="#2dd9e8"/></linearGradient></defs>`;

  const pos = {};
  nodes.forEach((n,i) => { pos[n.id] = {x: PAD+i*(NODE_W+GAP_X), y: totalH/2-NODE_H/2}; });
  window.__pos = pos;

  edges.forEach((e,idx) => {
    const a = pos[e.from], b = pos[e.to]; if (!a||!b) return;
    const d = edgePath(a,b), pathId = 'edgepath-'+idx;

    const glow = document.createElementNS('http://www.w3.org/2000/svg','path');
    glow.setAttribute('d',d); glow.setAttribute('id','glow-'+idx); glow.setAttribute('class','edge-glow');
    glow.setAttribute('stroke', KIND_COLOR[nodes[idx+1]?.kind] || '#9b7bff');
    svg.appendChild(glow);

    const base = document.createElementNS('http://www.w3.org/2000/svg','path');
    base.setAttribute('d',d); base.setAttribute('id',pathId); base.setAttribute('class','edge-base');
    svg.appendChild(base);

    if (!reduced){
      const comet = document.createElementNS('http://www.w3.org/2000/svg','circle');
      comet.setAttribute('r',2.8); comet.setAttribute('fill','url(#edgeGrad)'); comet.setAttribute('class','comet');
      comet.style.color = '#9b7bff';
      const anim = document.createElementNS('http://www.w3.org/2000/svg','animateMotion');
      anim.setAttribute('dur', (3.2+idx%3*.5)+'s'); anim.setAttribute('repeatCount','indefinite');
      anim.setAttribute('begin', (idx*0.3)+'s');
      const mpath = document.createElementNS('http://www.w3.org/2000/svg','mpath');
      mpath.setAttributeNS('http://www.w3.org/1999/xlink','href','#'+pathId);
      anim.appendChild(mpath); comet.appendChild(anim); svg.appendChild(comet);
    }

    if (e.count != null){
      const label = document.createElementNS('http://www.w3.org/2000/svg','text');
      const midx=(a.x+NODE_W+b.x)/2;
      label.setAttribute('x',midx); label.setAttribute('y', a.y+NODE_H/2-9);
      label.setAttribute('text-anchor','middle'); label.setAttribute('class','edge-count');
      label.textContent = e.count; svg.appendChild(label);
    }
  });

  const canvas = document.getElementById('canvas');
  canvas.querySelectorAll('.node').forEach(el => el.remove());
  nodes.forEach((n,i) => {
    const el = document.createElement('div');
    el.className = 'node entering'; el.dataset.id = n.id;
    el.style.left = pos[n.id].x+'px'; el.style.top = pos[n.id].y+'px';
    el.style.setProperty('--kc', KIND_COLOR[n.kind]||'#9b7bff');
    el.style.animationDelay = (0.3 + i*0.07)+'s';
    el.addEventListener('animationend', () => el.classList.remove('entering'), {once:true});
    el.innerHTML = `
      <div class="node-top"><span class="node-no">${String(i+1).padStart(2,'0')}</span><span class="kind-chip">${n.kind}</span></div>
      <div class="node-title">${n.label}</div>
      <div class="node-file">${n.file}::${n.function}</div>
      <div class="node-counts"><span>${n.count_in!=null?'in '+n.count_in:''}</span><span>${n.count_out!=null?'out '+n.count_out:''}</span></div>
    `;
    el.addEventListener('click', () => renderNodePanel(n));
    canvas.appendChild(el);
  });
}

function renderCaseDropdown(cases){
  const sel = document.getElementById('case-search');
  cases.slice(0,2000).forEach(c => {
    const opt = document.createElement('option'); opt.value = c.case_id; opt.textContent = `${c.case_id} — ${c.status}`;
    sel.appendChild(opt);
  });
}

function stateClass(s){ return ['ABSENT','PRESENT','REDACTED','ANONYMIZED'].includes(s) ? s : 'default'; }

function setPanel(html){
  const inner = document.getElementById('panel-inner');
  inner.style.animation = 'none'; void inner.offsetWidth;
  inner.innerHTML = html; inner.style.animation = `panelIn calc(.3s*var(--dur)) var(--ease) forwards`;
}

function renderNodePanel(n){
  document.querySelectorAll('.node').forEach(el => el.classList.toggle('selected', el.dataset.id===n.id));
  let extra = '';
  if (n.kind === 'LLM') extra = `<div class="section"><h3>LLM usage</h3>
    <div class="kv"><span class="k">calls</span><span class="v">${n.llm_calls??0}</span></div>
    <div class="kv"><span class="k">tokens</span><span class="v">${n.llm_tokens??0}</span></div></div>`;
  if (n.by_source) extra += `<div class="section"><h3>Observations by source</h3>` +
    Object.entries(n.by_source).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="kv"><span class="k">${k}</span><span class="v">${v}</span></div>`).join('') + `</div>`;
  if (n.status_counts) extra += `<div class="section"><h3>Status distribution</h3>` +
    Object.entries(n.status_counts).map(([k,v])=>`<div class="kv"><span class="k">${k}</span><span class="v">${v}</span></div>`).join('') + `</div>`;
  setPanel(`<div class="panel-kicker">${n.kind} stage</div><h2>${n.label}</h2>
    <div class="panel-file">${n.file}::${n.function}</div><p class="panel-desc">${n.desc}</p>${extra}`);
}

function renderCasePanel(c){
  const steps = [...c.steps].sort((a,b)=>a.step_no-b.step_no);
  const resourcesHtml = c.resources.map(r => `<div class="kv"><span class="k">${r.system_id} / ${r.resource_id}</span>
    <span class="v"><span class="state-tag ${stateClass(r.state)}">${r.state}</span></span></div>`).join('') || '<p class="muted">No resources resolved.</p>';
  const stepsHtml = steps.map(s => `<div class="t-item" style="--dc:${PHASE_COLOR[s.phase]}">
    <div class="phase-tag">${s.phase}</div><div class="t-op">${s.operation}</div>
    <div class="t-detail">${s.system_id} / ${s.resource_id} → ${s.state}${s.evidence_id?' · '+s.evidence_id:''}</div></div>`).join('');
  setPanel(`<div class="panel-kicker">Case trace</div><h2>${c.case_id}</h2>
    <span class="status-pill ${c.status}"><span class="d"></span>${c.status.replace('_',' ')}</span>
    <div class="section"><h3>Identity</h3>
      <div class="kv"><span class="k">user_id</span><span class="v">${c.user_id??'—'}</span></div>
      <div class="kv"><span class="k">account_id</span><span class="v">${c.account_id??'—'}</span></div>
      <div class="kv"><span class="k">account rule</span><span class="v">${c.account_rule??'—'}</span></div>
      <div class="kv"><span class="k">audit_record_id</span><span class="v">${c.audit_record_id??'—'}</span></div></div>
    <div class="section"><h3>Resources</h3>${resourcesHtml}</div>
    <div class="section"><h3>Step timeline</h3><div class="timeline">${stepsHtml||'<p class="muted">No steps — clean case.</p>'}</div></div>`);
}

function traceCase(){
  const order = window.__pipeline.nodes.map(n => n.id);
  document.querySelectorAll('.node').forEach(el => el.classList.remove('selected','lit'));
  document.querySelectorAll('.edge-glow').forEach(g => g.classList.remove('lit'));
  order.forEach((id,i) => {
    setTimeout(() => {
      const card = document.querySelector(`.node[data-id="${id}"]`);
      if (card){ card.classList.add('selected','lit'); }
      const glow = document.getElementById('glow-'+(i-1));
      if (glow) glow.classList.add('lit');
    }, reduced ? 0 : i*170);
  });
}
</script>
</body>
