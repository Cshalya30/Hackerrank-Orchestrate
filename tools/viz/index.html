<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ghost Data — Audit Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ===========================================================
   LAYOUT CONCEPT — a light operations dashboard: a KPI row, a
   compact horizontal pipeline stepper with an inline detail
   panel, and a searchable, paginated case table with a slide-in
   detail drawer. Calm, restrained, built for scanning.
   =========================================================== */
:root{
  --bg:          #f6f8fb;
  --surface:     #ffffff;
  --surface-2:   #fbfbfd;
  --border:      #e4e8f0;
  --border-strong:#d3dae6;
  --text:        #15192b;
  --text-dim:    #5b6472;
  --text-faint:  #8c94a3;
  --primary:     #4953d6;
  --primary-soft:#eef0fd;
  --good:        #167a52;
  --good-soft:   #e5f5ee;
  --warn:        #b2560e;
  --warn-soft:   #fcefe2;
  --neutral-chip:#eef0f4;
  --shadow-sm:   0 1px 2px rgba(20,24,41,.04), 0 1px 1px rgba(20,24,41,.03);
  --shadow-md:   0 8px 24px -8px rgba(20,24,41,.14), 0 2px 6px rgba(20,24,41,.06);
  --radius:      10px;
  --font-ui:     'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono:   'IBM Plex Mono', ui-monospace, Consolas, monospace;
  --dur: 1;
}
@media (prefers-reduced-motion: reduce){ :root{ --dur:1000; } }
*{box-sizing:border-box;}
body{
  margin:0; background:var(--bg); color:var(--text); font-family:var(--font-ui);
  font-size:13.5px; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1180px; margin:0 auto; padding:0 28px 56px;}

/* ---------- topbar ---------- */
.topbar{
  background:var(--surface); border-bottom:1px solid var(--border);
  padding:16px 28px; display:flex; align-items:center; gap:14px;
}
.topbar .mark{width:26px; height:26px; border-radius:7px; background:var(--primary);
  display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:12px;}
.topbar h1{font-size:14.5px; font-weight:600; margin:0;}
.topbar .sub{font-size:12px; color:var(--text-faint); margin-left:2px;}
.live{margin-left:auto; display:flex; align-items:center; gap:6px; font-size:12px; color:var(--good);
  background:var(--good-soft); padding:4px 10px; border-radius:999px; font-weight:500;}
.live .dot{width:6px; height:6px; border-radius:50%; background:var(--good);
  animation:pulse calc(2s*var(--dur)) ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;} 50%{opacity:.35;}}

/* ---------- section headings ---------- */
.section{margin-top:28px;}
.section-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:12px;}
.section-head h2{font-size:14px; font-weight:600; margin:0;}
.section-head .meta{font-size:12px; color:var(--text-faint);}

/* ---------- KPI cards ---------- */
.kpi-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-top:20px;}
.kpi{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  padding:16px 18px; box-shadow:var(--shadow-sm);}
.kpi .l{font-size:12px; color:var(--text-dim); font-weight:500;}
.kpi .n{font-size:26px; font-weight:700; margin-top:6px; font-variant-numeric:tabular-nums; letter-spacing:-.01em;}
.kpi .n small{font-size:14px; font-weight:600; color:var(--text-faint); margin-left:3px;}
.kpi .track{height:4px; border-radius:3px; background:var(--border); margin-top:12px; overflow:hidden;}
.kpi .track span{display:block; height:100%; background:var(--primary); width:0;
  transition:width calc(.8s*var(--dur)) cubic-bezier(.2,.8,.2,1);}
.kpi.good .track span{background:var(--good);}
.kpi .foot{font-size:11.5px; color:var(--text-faint); margin-top:8px;}

.dist-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  padding:16px 18px; box-shadow:var(--shadow-sm); margin-top:14px; display:flex; align-items:center; gap:22px;}
.dist-bar{flex:1; display:flex; height:10px; border-radius:6px; overflow:hidden; background:var(--border);}
.dist-bar span{height:100%; width:0; transition:width calc(.9s*var(--dur)) cubic-bezier(.2,.8,.2,1);}
.dist-legend{display:flex; gap:18px;}
.dist-legend .item{display:flex; align-items:center; gap:7px; font-size:12.5px;}
.dist-legend .sw{width:9px; height:9px; border-radius:3px;}
.dist-legend b{font-variant-numeric:tabular-nums;}

/* ---------- stepper ---------- */
.stepper-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  padding:22px 24px 18px; box-shadow:var(--shadow-sm);}
.stepper{display:flex; align-items:flex-start; overflow-x:auto; padding-bottom:4px;}
.step{flex:1; min-width:118px; position:relative; cursor:pointer; padding-top:2px;}
.step .connector{position:absolute; top:15px; left:calc(-50% + 15px); width:calc(100% - 0px); height:2px; background:var(--border); z-index:0;}
.step:first-child .connector{display:none;}
.step-badge{
  width:30px; height:30px; border-radius:50%; background:var(--surface-2); border:2px solid var(--border-strong);
  display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-size:11.5px;
  font-weight:600; color:var(--text-dim); position:relative; z-index:1; transition:all .15s;
}
.step[data-kind="LLM"] .step-badge{border-color:#8f7ee8; color:#6a57d8;}
.step[data-kind="Validation"] .step-badge{border-color:var(--good); color:var(--good);}
.step:hover .step-badge{border-color:var(--primary); color:var(--primary); transform:scale(1.06);}
.step.active .step-badge{background:var(--primary); border-color:var(--primary); color:#fff;}
.step-label{font-size:12.5px; font-weight:600; margin-top:9px; padding-right:12px;}
.step-kind{font-size:10.5px; color:var(--text-faint); margin-top:1px; text-transform:uppercase; letter-spacing:.04em;}
.step-counts{font-family:var(--font-mono); font-size:10.5px; color:var(--text-faint); margin-top:4px;}

.step-detail{margin-top:18px; padding-top:16px; border-top:1px solid var(--border); display:none;}
.step-detail.open{display:block; animation:fadeUp calc(.22s*var(--dur)) ease forwards;}
@keyframes fadeUp{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}
.step-detail .file{font-family:var(--font-mono); font-size:12px; color:var(--text-dim); margin-bottom:8px;}
.step-detail p{font-size:13px; color:var(--text-dim); line-height:1.6; margin:0 0 10px; max-width:70ch;}
.mini-table{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:8px; margin-top:10px;}
.mini-row{display:flex; justify-content:space-between; font-size:12px; padding:6px 10px; background:var(--surface-2);
  border:1px solid var(--border); border-radius:7px;}
.mini-row .k{color:var(--text-faint);}
.mini-row .v{font-weight:600; font-variant-numeric:tabular-nums;}

/* ---------- case table ---------- */
.table-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  box-shadow:var(--shadow-sm); overflow:hidden;}
.table-toolbar{display:flex; align-items:center; gap:10px; padding:14px 18px; border-bottom:1px solid var(--border);}
#case-search{
  flex:1; max-width:280px; font-family:var(--font-ui); font-size:13px; padding:8px 12px;
  border:1px solid var(--border-strong); border-radius:8px; background:var(--surface-2); color:var(--text);
}
#case-search:focus{outline:none; border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-soft);}
.status-filter{display:flex; gap:6px; margin-left:auto;}
.sf-chip{font-size:12px; padding:6px 11px; border-radius:999px; border:1px solid var(--border-strong);
  background:var(--surface); color:var(--text-dim); cursor:pointer; font-weight:500;}
.sf-chip.active{background:var(--text); color:#fff; border-color:var(--text);}

table{width:100%; border-collapse:collapse;}
thead th{
  text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-faint);
  font-weight:600; padding:10px 18px; border-bottom:1px solid var(--border); background:var(--surface-2);
}
tbody td{padding:11px 18px; border-bottom:1px solid var(--border); font-size:13px;}
tbody tr{cursor:pointer; transition:background .1s;}
tbody tr:hover{background:var(--surface-2);}
tbody tr:last-child td{border-bottom:none;}
.case-id{font-family:var(--font-mono); font-weight:500;}
.pill{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; padding:3px 9px; border-radius:999px;}
.pill.COMPLETE{background:var(--good-soft); color:var(--good);}
.pill.INCOMPLETE{background:var(--warn-soft); color:var(--warn);}
.pill.NOT_APPLICABLE{background:var(--neutral-chip); color:var(--text-dim);}
.pill .d{width:5px; height:5px; border-radius:50%; background:currentColor;}
.mono-cell{font-family:var(--font-mono); font-size:12px; color:var(--text-dim);}
.table-foot{display:flex; justify-content:space-between; align-items:center; padding:12px 18px; font-size:12px; color:var(--text-faint);}
.table-foot button{font-size:12.5px; font-weight:600; color:var(--primary); background:none; border:none; cursor:pointer; padding:0;}
.table-foot button:disabled{color:var(--text-faint); cursor:default;}

/* ---------- drawer ---------- */
.scrim{position:fixed; inset:0; background:rgba(15,18,30,.32); opacity:0; pointer-events:none; transition:opacity .18s; z-index:10;}
.scrim.open{opacity:1; pointer-events:auto;}
.drawer{
  position:fixed; top:0; right:0; bottom:0; width:420px; max-width:92vw; background:var(--surface);
  box-shadow:-18px 0 40px -12px rgba(20,24,41,.18); transform:translateX(100%);
  transition:transform calc(.26s*var(--dur)) cubic-bezier(.2,.9,.3,1); z-index:11; overflow-y:auto;
}
.drawer.open{transform:translateX(0);}
.drawer-head{position:sticky; top:0; background:var(--surface); padding:18px 22px; border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between;}
.drawer-head h3{margin:0; font-size:16px; font-weight:700; font-family:var(--font-mono);}
.drawer-close{width:28px; height:28px; border-radius:7px; border:1px solid var(--border); background:var(--surface-2);
  cursor:pointer; color:var(--text-dim); font-size:15px; line-height:1;}
.drawer-body{padding:20px 22px;}
.d-section{margin-bottom:22px;}
.d-section h4{font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-faint); margin:0 0 10px; font-weight:600;}
.d-kv{display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px solid var(--border); font-size:12.5px;}
.d-kv .k{color:var(--text-faint);}
.d-kv .v{font-family:var(--font-mono); font-weight:500;}
.state-pill{font-family:var(--font-mono); font-size:10.5px; font-weight:600; padding:2px 7px; border-radius:5px;}
.state-pill.ABSENT{background:var(--good-soft); color:var(--good);}
.state-pill.PRESENT{background:#fdeeec; color:#b3402c;}
.state-pill.REDACTED,.state-pill.ANONYMIZED{background:#eaf1fb; color:#2f63ad;}
.state-pill.default{background:var(--neutral-chip); color:var(--text-dim);}

.timeline{position:relative; padding-left:20px;}
.timeline::before{content:""; position:absolute; left:5px; top:6px; bottom:6px; width:2px; background:var(--border);}
.t-item{position:relative; padding-bottom:16px;}
.t-item:last-child{padding-bottom:0;}
.t-item::before{content:""; position:absolute; left:-20px; top:3px; width:10px; height:10px; border-radius:50%;
  background:var(--surface); border:2px solid var(--dot,var(--text-faint));}
.t-phase{font-size:10.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--dot,var(--text-faint));}
.t-op{font-size:13px; font-weight:600; margin-top:2px;}
.t-detail{font-family:var(--font-mono); font-size:11.5px; color:var(--text-faint); margin-top:3px;}

.muted{color:var(--text-faint); font-size:12.5px;}
::-webkit-scrollbar{width:9px;}
::-webkit-scrollbar-thumb{background:var(--border-strong); border-radius:5px;}

@media (max-width:900px){
  .kpi-grid{grid-template-columns:repeat(2,1fr);}
  .wrap{padding:0 16px 40px;}
  .dist-card{flex-direction:column; align-items:stretch; gap:12px;}
}
</style>
</head>
<body>
<div class="topbar">
  <div class="mark">GD</div>
  <h1>Ghost Data Audit</h1>
  <span class="sub">deletion-request compliance console</span>
  <span class="live"><span class="dot"></span>live from build artifacts</span>
</div>

<div class="wrap">
  <div class="section">
    <div class="section-head"><h2>Evaluation</h2><span class="meta" id="eval-meta">32 public sample cases</span></div>
    <div class="kpi-grid">
      <div class="kpi good"><div class="l">Status accuracy</div><div class="n" id="k-status">—</div>
        <div class="track"><span id="k-status-bar"></span></div><div class="foot" id="k-status-foot"></div></div>
      <div class="kpi good"><div class="l">Step F1</div><div class="n" id="k-f1">—</div>
        <div class="track"><span id="k-f1-bar"></span></div><div class="foot" id="k-f1-foot"></div></div>
      <div class="kpi"><div class="l">Sequence accuracy</div><div class="n" id="k-seq">—</div>
        <div class="track"><span id="k-seq-bar"></span></div><div class="foot" id="k-seq-foot"></div></div>
      <div class="kpi"><div class="l">LLM usage</div><div class="n" id="k-llm">—</div>
        <div class="track"><span id="k-llm-bar" style="background:#8f7ee8"></span></div><div class="foot" id="k-llm-foot"></div></div>
    </div>
    <div class="dist-card">
      <div class="dist-bar" id="dist-bar"></div>
      <div class="dist-legend" id="dist-legend"></div>
    </div>
  </div>

  <div class="section">
    <div class="section-head"><h2>Pipeline</h2><span class="meta">9 stages · click to inspect</span></div>
    <div class="stepper-card">
      <div class="stepper" id="stepper"></div>
      <div class="step-detail" id="step-detail"></div>
    </div>
  </div>

  <div class="section">
    <div class="section-head"><h2>Cases</h2><span class="meta" id="table-meta"></span></div>
    <div class="table-card">
      <div class="table-toolbar">
        <input id="case-search" type="text" placeholder="Search case_id…">
        <div class="status-filter" id="status-filter"></div>
      </div>
      <table>
        <thead><tr><th>Case</th><th>Status</th><th>User</th><th>Account</th><th>Steps</th></tr></thead>
        <tbody id="case-tbody"></tbody>
      </table>
      <div class="table-foot">
        <span id="page-info"></span>
        <div>
          <button id="prev-page">← Prev</button>
          &nbsp;&nbsp;
          <button id="next-page">Next →</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head"><h3 id="drawer-title">—</h3><button class="drawer-close" id="drawer-close">×</button></div>
  <div class="drawer-body" id="drawer-body"></div>
</div>

<script>
const PAGE_SIZE = 25;
const STATUS_META = {
  COMPLETE:{color:'#167a52'}, INCOMPLETE:{color:'#b2560e'}, NOT_APPLICABLE:{color:'#8c94a3'},
};
const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let state = { cases:[], filtered:[], page:0, statusFilter:null };

fetch('pipeline.json', {cache:'no-store'}).then(r => r.json()).then(renderAll).catch(err => {
  document.getElementById('case-tbody').innerHTML =
    `<tr><td colspan="5" class="muted">Could not load pipeline.json: ${err}</td></tr>`;
});

function pct(v){ return (v == null) ? '—' : (v*100).toFixed(1) + '%'; }
function fillBar(id, pctVal){
  requestAnimationFrame(() => requestAnimationFrame(() => {
    document.getElementById(id).style.width = Math.max(0, Math.min(100, pctVal)) + '%';
  }));
}

function renderAll(data){
  window.__pipeline = data;
  const m = data.metrics || {};

  document.getElementById('k-status').textContent = pct(m.status_accuracy);
  document.getElementById('k-status-foot').textContent = `${Math.round((m.status_accuracy||0)*32)} of 32 sample cases`;
  fillBar('k-status-bar', (m.status_accuracy||0)*100);

  document.getElementById('k-f1').textContent = pct(m.step_f1);
  document.getElementById('k-f1-foot').textContent = `precision ${pct(m.step_precision)} · recall ${pct(m.step_recall)}`;
  fillBar('k-f1-bar', (m.step_f1||0)*100);

  document.getElementById('k-seq').textContent = pct(m.sequence_accuracy);
  document.getElementById('k-seq-foot').textContent = 'exact ordered step-list match';
  fillBar('k-seq-bar', (m.sequence_accuracy||0)*100);

  document.getElementById('k-llm').innerHTML = `${m.llm_calls ?? 0}<small>calls</small>`;
  document.getElementById('k-llm-foot').textContent = `$${(m.llm_cost_usd ?? 0).toFixed(4)} · ${m.llm_tokens ?? 0} tokens`;
  fillBar('k-llm-bar', 100);

  renderDistribution(data.status_counts || {});
  renderStepper(data.nodes || []);
  state.cases = data.cases || [];
  document.getElementById('eval-meta').textContent = `${data.cases.length} full-run cases evaluated`;
  applyFilters();
  setupTableControls();
  setupDrawer();
}

function renderDistribution(sc){
  const total = Object.values(sc).reduce((a,b)=>a+b,0) || 1;
  const bar = document.getElementById('dist-bar');
  bar.innerHTML = Object.entries(sc).map(([k,v]) =>
    `<span style="background:${STATUS_META[k]?.color||'#ccc'}" data-w="${v/total*100}"></span>`).join('');
  requestAnimationFrame(() => requestAnimationFrame(() => {
    bar.querySelectorAll('span').forEach(s => s.style.width = s.dataset.w + '%');
  }));
  document.getElementById('dist-legend').innerHTML = Object.entries(sc).map(([k,v]) =>
    `<span class="item"><span class="sw" style="background:${STATUS_META[k]?.color||'#ccc'}"></span>${k.replace('_',' ')} <b>${v}</b></span>`).join('');
}

function renderStepper(nodes){
  const el = document.getElementById('stepper');
  el.innerHTML = nodes.map((n,i) => `
    <div class="step" data-id="${n.id}" data-kind="${n.kind}">
      <div class="connector"></div>
      <div class="step-badge">${i+1}</div>
      <div class="step-label">${n.label}</div>
      <div class="step-kind">${n.kind}</div>
      <div class="step-counts">${n.count_in != null ? 'in '+n.count_in : ''}${n.count_out != null ? ' · out '+n.count_out : ''}</div>
    </div>`).join('');
  el.querySelectorAll('.step').forEach(stepEl => {
    stepEl.addEventListener('click', () => {
      const n = nodes.find(n => n.id === stepEl.dataset.id);
      el.querySelectorAll('.step').forEach(s => s.classList.toggle('active', s === stepEl));
      showStepDetail(n);
    });
  });
}

function showStepDetail(n){
  const box = document.getElementById('step-detail');
  let extra = '';
  if (n.by_source){
    extra = `<div class="mini-table">` + Object.entries(n.by_source).sort((a,b)=>b[1]-a[1])
      .map(([k,v]) => `<div class="mini-row"><span class="k">${k}</span><span class="v">${v}</span></div>`).join('') + `</div>`;
  }
  if (n.status_counts){
    extra = `<div class="mini-table">` + Object.entries(n.status_counts)
      .map(([k,v]) => `<div class="mini-row"><span class="k">${k}</span><span class="v">${v}</span></div>`).join('') + `</div>`;
  }
  if (n.llm_calls != null){
    extra += `<div class="mini-table"><div class="mini-row"><span class="k">LLM calls</span><span class="v">${n.llm_calls}</span></div>
      <div class="mini-row"><span class="k">tokens</span><span class="v">${n.llm_tokens}</span></div></div>`;
  }
  box.innerHTML = `<div class="file">${n.file}::${n.function}</div><p>${n.desc}</p>${extra}`;
  box.classList.remove('open'); void box.offsetWidth; box.classList.add('open');
}

function applyFilters(){
  const q = document.getElementById('case-search').value.trim().toLowerCase();
  state.filtered = state.cases.filter(c =>
    (!q || c.case_id.toLowerCase().includes(q)) &&
    (!state.statusFilter || c.status === state.statusFilter));
  state.page = 0;
  renderTable();
}

function renderTable(){
  const start = state.page * PAGE_SIZE;
  const rows = state.filtered.slice(start, start + PAGE_SIZE);
  document.getElementById('case-tbody').innerHTML = rows.map(c => `
    <tr data-id="${c.case_id}">
      <td class="case-id">${c.case_id}</td>
      <td><span class="pill ${c.status}"><span class="d"></span>${c.status.replace('_',' ')}</span></td>
      <td class="mono-cell">${c.user_id ?? '—'}</td>
      <td class="mono-cell">${c.account_id ?? '—'}</td>
      <td>${c.steps.length}</td>
    </tr>`).join('') || `<tr><td colspan="5" class="muted">No cases match.</td></tr>`;
  document.querySelectorAll('#case-tbody tr[data-id]').forEach(tr => {
    tr.addEventListener('click', () => openDrawer(state.cases.find(c => c.case_id === tr.dataset.id)));
  });

  const total = state.filtered.length;
  const shown = Math.min(total, start + PAGE_SIZE);
  document.getElementById('page-info').textContent = total ? `${start+1}–${shown} of ${total}` : '0 results';
  document.getElementById('table-meta').textContent = `${total} case${total===1?'':'s'}`;
  document.getElementById('prev-page').disabled = state.page === 0;
  document.getElementById('next-page').disabled = shown >= total;
}

function setupTableControls(){
  document.getElementById('case-search').addEventListener('input', applyFilters);
  const filterWrap = document.getElementById('status-filter');
  const statuses = ['COMPLETE','INCOMPLETE','NOT_APPLICABLE'];
  filterWrap.innerHTML = `<span class="sf-chip active" data-s="">All</span>` +
    statuses.map(s => `<span class="sf-chip" data-s="${s}">${s.replace('_',' ')}</span>`).join('');
  filterWrap.querySelectorAll('.sf-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      filterWrap.querySelectorAll('.sf-chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      state.statusFilter = chip.dataset.s || null;
      applyFilters();
    });
  });
  document.getElementById('prev-page').addEventListener('click', () => { state.page--; renderTable(); });
  document.getElementById('next-page').addEventListener('click', () => { state.page++; renderTable(); });
}

function stateClass(s){ return ['ABSENT','PRESENT','REDACTED','ANONYMIZED'].includes(s) ? s : 'default'; }
const PHASE_COLOR = {FINDING:'#b3402c', REMEDIATION:'#b2560e', VERIFICATION:'#167a52'};

function openDrawer(c){
  document.getElementById('drawer-title').textContent = c.case_id;
  const steps = [...c.steps].sort((a,b) => a.step_no - b.step_no);
  const resourcesHtml = c.resources.map(r => `
    <div class="d-kv"><span class="k">${r.system_id} / ${r.resource_id}</span>
      <span class="v"><span class="state-pill ${stateClass(r.state)}">${r.state}</span></span></div>
  `).join('') || '<p class="muted">No resources resolved.</p>';
  const stepsHtml = steps.map(s => `
    <div class="t-item" style="--dot:${PHASE_COLOR[s.phase]}">
      <div class="t-phase">${s.phase}</div>
      <div class="t-op">${s.operation}</div>
      <div class="t-detail">${s.system_id} / ${s.resource_id} → ${s.state}${s.evidence_id ? ' · '+s.evidence_id : ''}</div>
    </div>`).join('') || '<p class="muted">No steps — clean case.</p>';

  document.getElementById('drawer-body').innerHTML = `
    <div class="d-section">
      <span class="pill ${c.status}" style="font-size:12.5px; padding:5px 12px;"><span class="d"></span>${c.status.replace('_',' ')}</span>
    </div>
    <div class="d-section"><h4>Identity</h4>
      <div class="d-kv"><span class="k">user_id</span><span class="v">${c.user_id ?? '—'}</span></div>
      <div class="d-kv"><span class="k">account_id</span><span class="v">${c.account_id ?? '—'}</span></div>
      <div class="d-kv"><span class="k">account rule</span><span class="v">${c.account_rule ?? '—'}</span></div>
      <div class="d-kv"><span class="k">audit_record_id</span><span class="v">${c.audit_record_id ?? '—'}</span></div>
    </div>
    <div class="d-section"><h4>Resources</h4>${resourcesHtml}</div>
    <div class="d-section"><h4>Step timeline</h4><div class="timeline">${stepsHtml}</div></div>
  `;
  document.getElementById('scrim').classList.add('open');
  document.getElementById('drawer').classList.add('open');
}

function closeDrawer(){
  document.getElementById('scrim').classList.remove('open');
  document.getElementById('drawer').classList.remove('open');
}

function setupDrawer(){
  document.getElementById('scrim').addEventListener('click', closeDrawer);
  document.getElementById('drawer-close').addEventListener('click', closeDrawer);
  window.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });
}
</script>
</body>
</html>
